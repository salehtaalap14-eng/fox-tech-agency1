<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fox Tech | Montage, Design & Interactive Websites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#D4AF37;--gold2:#B8860B;--bg:#0b0b0b;--card:#141414;--line:#262626;--text:#fff;--dim:#9a9a9a}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat','Cairo',sans-serif}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
.gold{background:linear-gradient(135deg,#FFF099 0%,var(--gold) 50%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 8%;background:rgba(11,11,11,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000}
.logo{font-size:24px;font-weight:900;letter-spacing:3px}
.btn{display:inline-block;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;padding:11px 26px;border-radius:8px;font-weight:700;text-decoration:none;transition:.3s}
.btn:hover{box-shadow:0 0 25px rgba(212,175,55,.55);transform:translateY(-2px)}
.btn-ghost{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:11px 26px;border-radius:8px;font-weight:600;text-decoration:none;transition:.3s}
.btn-ghost:hover{background:rgba(212,175,55,.1)}
.hero{position:relative;text-align:center;padding:110px 8% 90px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 30% 40%,rgba(212,175,55,.18),transparent 45%),radial-gradient(circle at 70% 60%,rgba(184,134,11,.14),transparent 45%);animation:drift 12s ease-in-out infinite alternate;z-index:0}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-3%,2%) scale(1.08)}}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:3.2rem;font-weight:800;margin-bottom:20px;text-transform:uppercase;line-height:1.2}
.hero p{font-size:1.15rem;color:var(--dim);max-width:720px;margin:0 auto 36px}
.cta{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
section{padding:90px 8%}
.title{text-align:center;font-size:2.2rem;font-weight:800;margin-bottom:12px}
.subtitle{text-align:center;color:var(--dim);margin-bottom:55px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;transition:.35s}
.card:hover{border-color:var(--gold);transform:translateY(-6px);box-shadow:0 10px 35px rgba(212,175,55,.15)}
.card .ic{font-size:34px;margin-bottom:16px}
.card h3{color:var(--gold);font-size:1.25rem;margin-bottom:10px}
.card p{color:var(--dim);font-size:.95rem}
.portfolio{background:#0e0e0e;border-top:1px solid var(--line)}
.group{margin-bottom:70px}
.group h3{font-size:1.35rem;color:var(--gold);margin-bottom:8px;padding-right:14px;border-right:3px solid var(--gold)}
.group .desc{color:var(--dim);font-size:.92rem;margin-bottom:24px;padding-right:17px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;perspective:1000px}
.vcard{position:relative;aspect-ratio:9/16;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;padding:0;color:#fff;text-align:start;transition:transform .15s ease-out,border-color .3s,box-shadow .3s;transform-style:preserve-3d;background:#111}
.vcard .cover{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .5s}
.vcard.fallback .cover{background:
  linear-gradient(90deg,#000 0 8%,transparent 8% 92%,#000 92%),
  repeating-linear-gradient(90deg,transparent 0 14px,rgba(212,175,55,.15) 14px 16px),
  radial-gradient(circle at 50% 40%,rgba(212,175,55,.35),transparent 60%),
  linear-gradient(160deg,#2a2410,#141414 60%,#080808)}
.vcard::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9),transparent 55%);z-index:1}
.vcard:hover{border-color:var(--gold);box-shadow:0 12px 40px rgba(212,175,55,.3)}
.vcard:hover .cover{transform:scale(1.06)}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;display:flex;align-items:center;justify-content:center;font-size:1.2rem;padding-left:4px;box-shadow:0 0 25px rgba(212,175,55,.6);z-index:2;transition:.3s}
.vcard:hover .play{transform:translate(-50%,-50%) scale(1.12)}
.vtitle{position:absolute;bottom:16px;right:16px;left:16px;font-weight:700;font-size:.95rem;z-index:2}
.tag{position:absolute;top:12px;right:12px;z-index:2;background:rgba(0,0,0,.6);border:1px solid var(--gold);color:var(--gold);font-size:.7rem;padding:3px 8px;border-radius:20px}
footer{text-align:center;padding:26px;color:var(--dim);font-size:.85rem;border-top:1px solid #1e1e1e}
.reveal{opacity:0;transform:translateY(30px);transition:.8s ease}
.reveal.show{opacity:1;transform:none}
@media(max-width:640px){
 header{padding:14px 5%}.logo{font-size:19px}
 .hero{padding:70px 5%}.hero h1{font-size:2rem}.hero p{font-size:1rem}
 section{padding:60px 5%}.title{font-size:1.7rem}
 .vgrid{grid-template-columns:repeat(2,1fr);gap:12px}.vtitle{font-size:.8rem}
}
</style>
</head>
<body>

<header>
  <div class="logo gold" id="brand"></div>
  <a id="headerCta" class="btn" target="_blank" rel="noopener"></a>
</header>

<section class="hero">
  <h1 class="gold" id="heroTitle"></h1>
  <p id="heroText"></p>
  <div class="cta">
    <a id="heroWhatsapp" class="btn" target="_blank" rel="noopener"></a>
    <a id="heroEmail" class="btn-ghost"></a>
  </div>
</section>

<section>
  <h2 class="title gold" id="servicesTitle"></h2>
  <p class="subtitle" id="servicesSub"></p>
  <div class="grid" id="servicesGrid"></div>
</section>

<section class="portfolio">
  <h2 class="title gold" id="portfolioTitle"></h2>
  <p class="subtitle" id="portfolioSub"></p>
  <div id="portfolioContent"></div>
</section>

<section>
  <h2 class="title gold" id="contactTitle"></h2>
  <p class="subtitle" id="contactText"></p>
  <div id="contactInfo" style="display:flex;justify-content:center;gap:30px;flex-wrap:wrap;font-size:1.05rem"></div>
</section>

<footer id="footer"></footer>

<script>
/* ==========================================================
   ✏️ كل التعديلات هنا بس
   - فيديو جديد: انسخ سطر { title, url } وحطه في القسم وافصل بفاصلة ,
   - cover: الصورة الثابتة اللي بتظهر على كل الكروت.
     لو فاضي "" يظهر التصميم الافتراضي (شريط فيلم + ذهبي).
     لتغييرها: ارفع صورة باسم cover.jpg في فولدر thumbs، واكتب "thumbs/cover.jpg"
   ========================================================== */
const SITE = {
  brand: "FOX TECH",
  whatsapp: "201212896898",
  email: "salehtaalap14@gmail.com",
  headerButton: "Contact Us",

  hero: {
    title: "Scale Your Brand With Fox Tech 🚀",
    text: "مونتاج سينمائي • تصميم يشد • إدارة صفحات • مواقع تفاعلية ثنائية وثلاثية الأبعاد",
    whatsappButton: "Start on WhatsApp 💬",
    emailButton: "Send Email 📧"
  },

  services: {
    title: "Our Services",
    sub: "كل اللي يحتاجه براندك في مكان واحد",
    items: [
      { icon: "🎯", name: "Meta Paid Ads", description: "حملات إعلانية على فيسبوك وانستجرام مبنية على عائد قابل للقياس." },
      { icon: "🎬", name: "Video Production", description: "ريلز، فيديوهات توكينج هيد، تأثيرات حركية ومونتاج سينمائي." },
      { icon: "🎨", name: "Graphic Design", description: "تصاميم إعلانية وهويات بصرية كاملة وبوستات سوشيال تشد العين." },
      { icon: "📲", name: "Social Media Management", description: "استراتيجية محتوى، نشر منظم، نمو للصفحات، وتمركز للبراند." },
      { icon: "🌐", name: "Interactive & 3D Websites", description: "مواقع بحركة وتفاعل، وتجارب ثنائية وثلاثية الأبعاد تفضل في الذاكرة." },
      { icon: "📊", name: "Financial & Tax Consulting", description: "محاسبة، مراجعة مالية، إقرارات ضريبية، وتأسيس الكيانات التجارية." }
    ]
  },

  portfolio: {
    title: "🎞️ شغلنا بيتكلم عننا | Our Work",
    sub: "مونتاج سينمائي، تصميم يشد، وإدارة صفحات بتجيب نتايج. شوف بنفسك 👇",
    cover: "",
    sections: [
      {
        name: "⚖️ محتوى قانوني | Legal Content",
        desc: "شرح مبسط وواضح يوصل للناس بسرعة.",
        videos: [
          { title: "قانوني 01", url: "https://www.facebook.com/share/v/1DmnuUcYC1/" },
          { title: "قانوني 02", url: "https://www.facebook.com/share/v/1MHhkcDnTe/" },
          { title: "قانوني 03", url: "https://www.facebook.com/share/v/19RpymmeUS/" },
          { title: "قانوني 04", url: "https://www.facebook.com/share/r/1E5H79y8wC/" }
        ]
      },
      {
        name: "📚 محتوى تعليمي | Educational",
        desc: "قصص وتاريخ بإيقاع يخلي المشاهد يكمّل لآخر ثانية.",
        videos: [
          { title: "تعليمي 01", url: "https://www.facebook.com/share/v/1DgQp6MzGC/" },
          { title: "تعليمي 02", url: "https://www.facebook.com/share/r/196wcR7GCq/" },
          { title: "تعليمي 03", url: "https://www.facebook.com/share/v/1F2hg15UnT/" },
          { title: "تعليمي 04", url: "https://www.facebook.com/share/v/1F4AEsRV1L/" },
          { title: "تعليمي 05", url: "https://www.facebook.com/share/v/1964MsX73X/" }
        ]
      },
      {
        name: "🏋️ أجهزة رياضية | Fitness Equipment",
        desc: "لقطات قريبة وتقطيع احترافي يبرز المنتج.",
        videos: [
          { title: "رياضي 01", url: "https://www.facebook.com/share/r/1DUJsnNNWv/" },
          { title: "رياضي 02", url: "https://www.facebook.com/share/r/1Dr9WWd18n/" },
          { title: "رياضي 03", url: "https://www.facebook.com/share/v/19QuMx5Bjw/" },
          { title: "رياضي 04", url: "https://www.facebook.com/share/r/1FNLUikCfi/" }
        ]
      },
      {
        name: "✂️ نماذج مونتاج | Montage Showcase",
        desc: "شغل حقيقي من الاستوديو بجودة عالية.",
        videos: [
          { title: "Fox Tech Montage", url: "https://www.facebook.com/share/p/1JrkPhnAme/" }
        ]
      }
    ]
  },

  contact: {
    title: "Let's Build Something Great",
    text: "قولنا على براندك ونجهزلك الخطة المناسبة.",
    phones: ["+20 1212896898", "+20 1210371836"],
    location: "Cairo, Egypt"
  },

  footer: "© 2026 Fox Tech. All rights reserved."
};

/* ========== الكود (متعدلهوش) ========== */
(function () {
  const $ = id => document.getElementById(id);
  const wa = `https://wa.me/${SITE.whatsapp}`;

  document.title = `${SITE.brand} | Montage, Design & Interactive Websites`;
  $("brand").textContent = SITE.brand;
  $("headerCta").textContent = SITE.headerButton;
  $("headerCta").href = wa;

  $("heroTitle").textContent = SITE.hero.title;
  $("heroText").textContent = SITE.hero.text;
  $("heroWhatsapp").textContent = SITE.hero.whatsappButton;
  $("heroWhatsapp").href = wa;
  $("heroEmail").textContent = SITE.hero.emailButton;
  $("heroEmail").href = `mailto:${SITE.email}`;

  $("servicesTitle").textContent = SITE.services.title;
  $("servicesSub").textContent = SITE.services.sub;
  SITE.services.items.forEach(s => {
    const c = document.createElement("div");
    c.className = "card reveal";
    c.innerHTML = `<div class="ic"></div><h3></h3><p></p>`;
    c.querySelector(".ic").textContent = s.icon;
    c.querySelector("h3").textContent = s.name;
    c.querySelector("p").textContent = s.description;
    $("servicesGrid").appendChild(c);
  });

  const P = SITE.portfolio;
  $("portfolioTitle").textContent = P.title;
  $("portfolioSub").textContent = P.sub;
  const content = $("portfolioContent");

  P.sections.forEach(sec => {
    const g = document.createElement("div");
    g.className = "group reveal";
    const h3 = document.createElement("h3");
    h3.textContent = sec.name;
    const d = document.createElement("p");
    d.className = "desc";
    d.textContent = sec.desc;
    const vg = document.createElement("div");
    vg.className = "vgrid";

    sec.videos.forEach(v => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "vcard" + (P.cover ? "" : " fallback");
      b.innerHTML = `<span class="cover"></span><span class="tag">MONTAGE</span><span class="play">▶</span><span class="vtitle"></span>`;
      if (P.cover) b.querySelector(".cover").style.backgroundImage = `url("${P.cover}")`;
      b.querySelector(".vtitle").textContent = v.title;
      b.addEventListener("click", () => window.open(v.url, "_blank", "noopener"));

      // تأثير ميل 3D خفيف مع حركة الماوس
      b.addEventListener("mousemove", e => {
        const r = b.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        b.style.transform = `rotateY(${x * 12}deg) rotateX(${-y * 12}deg) translateY(-4px)`;
      });
      b.addEventListener("mouseleave", () => { b.style.transform = ""; });

      vg.appendChild(b);
    });

    g.append(h3, d, vg);
    content.appendChild(g);
  });

  $("contactTitle").textContent = SITE.contact.title;
  $("contactText").textContent = SITE.contact.text;
  const info = $("contactInfo");
  [
    `📞 <strong>WhatsApp:</strong> ${SITE.contact.phones.join(" | ")}`,
    `📧 <strong>Email:</strong> ${SITE.email}`,
    `📍 <strong>Location:</strong> ${SITE.contact.location}`
  ].forEach(html => { const x = document.createElement("div"); x.innerHTML = html; info.appendChild(x); });

  $("footer").textContent = SITE.footer;

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("show"); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
})();
</script>
</body>
</html>
