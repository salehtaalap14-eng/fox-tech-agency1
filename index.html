body.light{--bg:#f6f3ea;--card:#fff;--gold:#A67C00;--gold2:#7a5a00;--g1:#C9A227;--line:rgba(166,124,0,.35);--tx:#161616;--dim:#5b5b5b;--hd:rgba(246,243,234,.88);--sec:#ece7d8}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Montserrat',sans-serif;background:var(--bg);color:var(--tx);line-height:1.7;overflow-x:hidden;transition:background .4s,color .4s}
html[lang=en] body{font-family:'Montserrat','Cairo',sans-serif}
html[lang=en] h1,html[lang=en] h2,html[lang=en] .logo{font-family:'Russo One','Montserrat',sans-serif;font-weight:400}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main,footer{position:relative;z-index:1}
.gt{background:linear-gradient(135deg,var(--g1),var(--gold) 50%,var(--gold2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 6%;background:var(--hd);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-size:24px;font-weight:900;letter-spacing:3px;white-space:nowrap}
nav{display:flex;gap:4px}
nav a{color:var(--dim);text-decoration:none;padding:6px 12px;border-radius:8px;font-weight:600;transition:.3s}
nav a:hover{color:var(--gold)}
.tools{display:flex;gap:8px;align-items:center}
.ib{background:none;border:1px solid var(--gold);color:var(--gold);padding:7px 13px;border-radius:8px;cursor:pointer;font:700 .85rem inherit;font-family:inherit}
.btn,.ghost{display:inline-block;padding:11px 26px;border-radius:10px;font-weight:700;text-decoration:none;transition:.3s;white-space:nowrap}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}
.btn:hover{box-shadow:0 0 26px rgba(212,175,55,.6);transform:translateY(-2px)}
.ghost{border:1px solid var(--gold);color:var(--gold)}
.ghost:hover{background:rgba(212,175,55,.12)}
.hero{text-align:center;padding:120px 6% 90px;background:radial-gradient(circle at 50% 30%,rgba(212,175,55,.16),transparent 60%)}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.25;margin-bottom:20px;font-weight:900}
.hero p{font-size:1.15rem;color:var(--dim);max-width:720px;margin:0 auto 34px}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
section{padding:90px 6%}
section:nth-of-type(even){background:var(--sec)}
section>h2{text-align:center;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;margin-bottom:8px}
.sub{text-align:center;color:var(--dim);margin-bottom:50px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.glass{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:30px}
.tilt{position:relative;overflow:hidden;transition:transform .15s ease-out,box-shadow .3s,border-color .3s}
.tilt::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,240,160,.3),transparent 45%)}
.tilt:hover{border-color:var(--gold);box-shadow:0 14px 40px rgba(212,175,55,.25)}
.tilt:hover::after{opacity:1}
.ic{font-size:34px;margin-bottom:12px}
.glass h3{color:var(--gold);margin-bottom:8px;font-family:'Montserrat','Cairo',sans-serif;font-weight:800}
.glass p{color:var(--dim);font-size:.95rem}
.grp{margin-bottom:56px}
.grp>h3{font-size:1.35rem;color:var(--gold);margin-bottom:22px;padding-inline-start:14px;border-inline-start:3px solid var(--gold)}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.v{display:block;aspect-ratio:9/16;border:1px solid var(--line);border-radius:16px;background:var(--fb);background-size:cover;background-position:center;color:#fff;text-decoration:none}
.v::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 55%)}
.v b{position:absolute;z-index:2;bottom:14px;inset-inline:14px}
.pl{position:absolute;z-index:2;top:50%;left:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;display:grid;place-items:center;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,175,55,.6)}70%{box-shadow:0 0 0 22px rgba(212,175,55,0)}100%{box-shadow:0 0 0 0 rgba(212,175,55,0)}}
.tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:34px}
.tab{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:9px 20px;border-radius:30px;cursor:pointer;font:600 .92rem inherit;font-family:inherit;transition:.3s}
.tab:hover{border-color:var(--gold)}
.tab.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border-color:transparent}
.gg{columns:4 230px;column-gap:16px}
.gg[hidden]{display:none}
.g{display:block;break-inside:avoid;margin-bottom:16px;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.g img{width:100%;display:block}
.msg{text-align:center;color:var(--dim);padding:40px;column-span:all}
.tc{text-align:center}
.av{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;border:2px solid var(--gold);display:grid;place-items:center;font-weight:900;font-size:1.9rem;color:var(--gold);background:linear-gradient(135deg,#2B2B2B,#111);position:relative;overflow:hidden;font-family:'Montserrat',sans-serif}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rl{color:var(--gold);font-size:.82rem;font-weight:700;margin-bottom:12px;direction:ltr;font-family:'Montserrat',sans-serif;letter-spacing:.3px}
.mq{overflow:hidden;direction:ltr;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mt{display:flex;gap:26px;width:max-content;animation:mq 45s linear infinite}
.mq:hover .mt{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.pt{width:150px;height:110px;border-radius:14px;background:#f4f1e8;display:grid;place-items:center;padding:12px;border:1px solid var(--line);filter:grayscale(.7);transition:.3s}
a.pt:hover{filter:none;box-shadow:0 0 28px rgba(212,175,55,.65);border-color:var(--gold);transform:scale(1.07)}
.pt img{max-width:100%;max-height:100%;object-fit:contain}
.ci{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-bottom:26px}
.ci a{color:var(--tx);text-decoration:none}
.soc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
footer{text-align:center;padding:26px;color:var(--dim);font-size:.85rem;border-top:1px solid var(--line)}
#lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;direction:ltr}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:88vh;border:1px solid var(--line);border-radius:10px}
.lbb{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid var(--gold);color:var(--gold);font-size:1.2rem;cursor:pointer}

</style>

  hit.forEach(i=>{const a=document.createElement("a");a.className="g tilt rv";a.href=i.src;i.alt="";a.appendChild(i);a.onclick=e=>{e.preventDefault();openLb(c.g,i.src)};c.g.appendChild(a)});
  watch();n+=6;
 }
 if(!any)c.g.innerHTML=`<p class="msg">${UI[L].soon}</p>`;
}
function showCat(k){cur=k;SITE.cats.forEach((c,i)=>c.g.hidden=i!==k);document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("on",i===k));loadCat(SITE.cats[k])}

/* Lightbox */
let LB=[],li=0;
function openLb(g,s){LB=[...g.querySelectorAll("img")].map(i=>i.src);li=LB.indexOf(s);$("li").src=LB[li];$("lb").classList.add("on")}
const mv=d=>{li=(li+d+LB.length)%LB.length;$("li").src=LB[li]};
$("lx").onclick=()=>$("lb").classList.remove("on");
$("lp").onclick=()=>mv(-1);$("ln").onclick=()=>mv(1);
$("lb").onclick=e=>{if(e.target.id==="lb")$("lb").classList.remove("on")};
document.addEventListener("keydown",e=>{if(!$("lb").classList.contains("on"))return;if(e.key==="Escape")$("lb").classList.remove("on");if(e.key==="ArrowLeft")mv(-1);if(e.key==="ArrowRight")mv(1)});

/* 3D tilt + glare */
document.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const el=e.target.closest(".tilt");if(!el)return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;el.style.transform=`perspective(800px) rotateY(${(x-.5)*12}deg) rotateX(${(.5-y)*12}deg) translateY(-4px)`;el.style.setProperty("--mx",x*100+"%");el.style.setProperty("--my",y*100+"%")});
document.addEventListener("pointerout",e=>{const el=e.target.closest&&e.target.closest(".tilt");if(el&&!el.contains(e.relatedTarget))el.style.transform=""});

function render(){
 const U=UI[L],S=SITE,wa=`https://wa.me/${S.wa}`;
 document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 document.body.classList.toggle("light",TH==="light");
 $("lg").textContent=U.lg;$("tb").textContent=TH==="dark"?"☀️":"🌙";
 $("hc").textContent=U.cta;$("hc").href=wa;
 $("nv").innerHTML=Object.keys(S.sec).map(k=>`<a href="#${k}">${t(S.sec[k].n)}</a>`).join("");
 $("h1").textContent=t(S.hero.t);$("hp").textContent=t(S.hero.p);
 $("hw").textContent=U.hw;$("hw").href=wa;$("he").textContent=U.he;$("he").href=`mailto:${S.email}`;
 for(const k in S.sec){$(k).querySelector("h2").textContent=t(S.sec[k].t);$(k).querySelector(".sub").textContent=t(S.sec[k].s)}
 $("sv").innerHTML=S.services.map(s=>`<div class="glass tilt rv"><div class="ic">${s[0]}</div><h3>${t(s[1])}</h3><p>${t(s[2])}</p></div>`).join("");
 $("vd").innerHTML=S.videos.map(g=>`<div class="grp"><h3>${t(g.n)}</h3><div class="vg">${g.u.map((u,i)=>`<a class="v tilt rv" href="${u}" target="_blank" rel="noopener" style="background-image:url('${g.c}'),var(--fb)"><span class="pl">▶</span><b>${t(g.p)} ${String(i+1).padStart(2,"0")}</b></a>`).join("")}</div></div>`).join("");
 $("tabs").innerHTML=S.cats.map((c,i)=>`<button class="tab${i===cur?" on":""}" data-i="${i}">${t(c.n)}</button>`).join("");
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showCat(+b.dataset.i));
 $("tm").innerHTML=S.team.map(m=>`<article class="glass tilt tc rv"><div class="av"><span>${t(m.i)}</span><img src="${m.ph}" alt="" onerror="this.remove()"></div><h3 class="gt">${t(m.n)}</h3><div class="rl">${t(m.r)}</div><p>${t(m.b)}</p></article>`).join("");
 const pl=S.partners.map(p=>{const im=`<img src="partners/${p[1]}" alt="${p[0]}" loading="lazy">`;return p[2]?`<a class="pt" href="${p[2]}" target="_blank" rel="noopener" title="${p[0]}">${im}</a>`:`<span class="pt" title="${p[0]}">${im}</span>`}).join("");
 $("pm").innerHTML=pl+pl;
 $("ci").innerHTML=`<div>📞 ${S.phones.map(p=>`<a href="tel:${p.replace(/\s/g,"")}">${p}</a>`).join(" | ")}</div><div>📧 <a href="mailto:${S.email}">${S.email}</a></div><div>📍 ${L==="ar"?"القاهرة، مصر":"Cairo, Egypt"}</div>`;
 $("so").innerHTML=Object.entries(S.social).filter(e=>e[1]).map(e=>`<a class="ghost" href="${e[1]}" target="_blank" rel="noopener">${e[0]}</a>`).join("");
 $("ft").textContent=t(S.foot);
 watch();
}
$("lg").onclick=()=>{L=L==="ar"?"en":"ar";render()};
$("tb").onclick=()=>{TH=TH==="dark"?"light":"dark";render()};

/* أقسام الجرافيك: كل قسم له حاوية ثابتة بتتحمل أول ما تدوس عليه */
SITE.cats.forEach(c=>{c.g=document.createElement("div");c.g.className="gg";c.g.hidden=true;$("gl").appendChild(c.g)});
render();showCat(0);

/* Gold dust */
(()=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const c=$("dust"),x=c.getContext("2d");let w,h;const P=[],N=innerWidth<700?26:55;
const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener("resize",rs);
for(let i=0;i<N;i++)P.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.4,s:Math.random()*.25+.05,a:Math.random()*.5+.15,d:Math.random()*2-1});
(function f(){x.clearRect(0,0,w,h);for(const p of P){p.y-=p.s;p.x+=p.d*.15;if(p.y<-5){p.y=h+5;p.x=Math.random()*w}x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fillStyle=`rgba(212,175,55,${p.a})`;x.fill()}requestAnimationFrame(f)})()})();
</script>
</body>
